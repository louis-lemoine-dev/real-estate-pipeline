[project]
name = "real-estate-pipeline"
version = "0.1.0"
description = ""
authors = [
    {name = "Louis Lemoine",email = "louislemoine4@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "protego (>=0.6.2,<0.7.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (common bug patterns)
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
[dependency-groups]
dev = [
    "ruff (>=0.16.2,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pyright (>=1.1.411,<2.0.0)"
]

[tool.pyright]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "**/.venv",
    "scratch",
]
